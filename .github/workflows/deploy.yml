name: Build and Deploy APK

on:
  push:
    tags:
      - 'v*'

# Least-privilege default: this workflow only needs to read the repo and
# upload a build artifact, it never needs to write back to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get dependencies
        working-directory: government_simulator
        run: flutter pub get

      - name: Build APK
        working-directory: government_simulator
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: government_simulator-release-apk
          path: government_simulator/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
