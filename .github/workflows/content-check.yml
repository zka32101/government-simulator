name: content-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan diff for forbidden words
        env:
          # Register comma-separated words to detect (real name, employer, etc.)
          # as a repository secret so they never appear in the workflow file itself:
          # Settings > Secrets and variables > Actions > New repository secret
          #   Name: FORBIDDEN_WORDS_CSV  Value: "実名,勤務先名,..."
          FORBIDDEN_WORDS_CSV: ${{ secrets.FORBIDDEN_WORDS_CSV }}
        run: |
          if [ -z "$FORBIDDEN_WORDS_CSV" ]; then
            echo "FORBIDDEN_WORDS_CSV is not set. Register it in repo Secrets to enable this check."
            exit 0
          fi
          # pull_request イベントでは origin/<base> との比較で正しく差分が
          # 取れるが、push イベント（main へのマージ等）では checkout 済みの
          # origin/main が既に HEAD と同一コミットを指しているため
          # `git diff origin/main...HEAD` は常に空になり、この安全チェックが
          # push トリガーでは静かに何もスキャンしないバグがあった
          # （空diffはgitのエラーにならないため `|| git show HEAD`
          # フォールバックも発動しない）。push イベントでは代わりに
          # このプッシュ直前のコミット(github.event.before)との差分を取る。
          BEFORE_SHA="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            DIFF=$(git diff "origin/${{ github.base_ref }}...HEAD")
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            DIFF=$(git diff "$BEFORE_SHA...HEAD")
          else
            # 初回push・force-push等で before が使えない場合は、最終手段として
            # 直近コミットの内容だけでも見る。
            DIFF=$(git show HEAD)
          fi
          FOUND=0
          IFS=',' read -ra WORDS <<< "$FORBIDDEN_WORDS_CSV"
          for w in "${WORDS[@]}"; do
            if echo "$DIFF" | grep -iq -- "$w"; then
              echo "::error::Forbidden word detected in diff (details masked)"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi

      - name: Check for accidentally committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
